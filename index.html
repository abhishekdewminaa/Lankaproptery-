<!doctype html>
<html lang="en">
  <head>
    <script>
    window.onerror = function(msg, src, line, col, err) {
      document.body.style.background = 'white';
      document.body.innerHTML = '<div style="padding:20px;font-family:monospace;color:red">' +
        '<h2>JS ERROR:</h2><pre>' + msg + '\nat ' + src + ':' + line + '</pre></div>';
    };
    window.addEventListener('unhandledrejection', function(e) {
      var reasonStr = String(e.reason && (e.reason.stack || e.reason.message || e.reason));
      if (reasonStr.indexOf('WebSocket') > -1 || reasonStr.indexOf('websocket') > -1 || reasonStr.indexOf('vite') > -1) {
        return;
      }
      document.body.style.background = 'white';  
      document.body.innerHTML = '<div style="padding:20px;font-family:monospace;color:red">' +
        '<h2>PROMISE ERROR:</h2><pre>' + reasonStr + '</pre></div>';
    });
    </script>
    <script>
    /* SUPPRESSION - MUST BE FIRST */
    ;(function(){
      try {
        window.process = { env: { NODE_ENV: 'development', GEMINI_API_KEY: '' } };
        window.global = window;
      } catch(e) {}
      try {
        var nativeFetch = window.fetch;
        if (nativeFetch) {
          Object.defineProperty(window, 'fetch', {
            get: function() { return nativeFetch; },
            set: function() { },
            configurable: true
          });
        }
      } catch(e) {}
      var _warn = console.warn
      console.warn = function() {
        var msg = Array.from(arguments).join(' ')
        if (
          msg.indexOf('width') > -1 ||
          msg.indexOf('height') > -1 ||
          msg.indexOf('greater than 0') > -1 ||
          msg.indexOf('chart') > -1 ||
          msg.indexOf('Chart') > -1 ||
          msg.indexOf('WebSocket') > -1 ||
          msg.indexOf('websocket') > -1 ||
          msg.indexOf('vite') > -1 ||
          msg.indexOf('ResponsiveContainer') > -1
        ) {
          return
        }
        _warn.apply(console, arguments)
      }
      var _error = console.error
      console.error = function() {
        var msg = Array.from(arguments).join(' ')
        if (
          msg.indexOf('WebSocket') > -1 ||
          msg.indexOf('websocket') > -1 ||
          msg.indexOf('width') > -1 ||
          msg.indexOf('height') > -1 ||
          msg.indexOf('greater than 0') > -1 ||
          msg.indexOf('vite') > -1
        ) {
          return
        }
        _error.apply(console, arguments)
        try {
          var payload = { 
            type: 'console_error', 
            message: msg, 
            stack: new Error().stack 
          };
          // Use original nativeFetch to bypass any potential overriding or infinite loops
          (window.fetch || nativeFetch)('/api/log-error', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
          }).catch(function(){});
        } catch(err){}
      }
      window.addEventListener('error', function(e) {
        try {
          var payload = {
            type: 'window_onerror',
            message: e.message || String(e),
            filename: e.filename,
            lineno: e.lineno,
            colno: e.colno,
            stack: e.error ? e.error.stack : null
          };
          (window.fetch || nativeFetch)('/api/log-error', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
          }).catch(function(){});
        } catch(err){}
      });
      window.addEventListener(
        'unhandledrejection',
        function(e) {
          if (e.reason && typeof e.reason === 'string' && e.reason.indexOf('WebSocket') > -1) { e.preventDefault(); return }
          if (e.reason && e.reason.message && e.reason.message.indexOf('WebSocket') > -1) { e.preventDefault(); return }
          try {
            var reasonMsg = e.reason ? (e.reason.message || String(e.reason)) : 'unknown';
            var reasonStack = e.reason ? e.reason.stack : null;
            var payload = {
              type: 'unhandled_rejection',
              message: reasonMsg,
              stack: reasonStack
            };
            (window.fetch || nativeFetch)('/api/log-error', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify(payload)
            }).catch(function(){});
          } catch(err){}
        }, 
        true
      )
    })()
    </script>

    <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, max-scale=5.0, viewport-fit=cover" />

    <script>
      // Forcibly unregister any leftover service workers
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then(function(registrations) {
          for(let registration of registrations) {
            registration.unregister();
            console.log('Unregistered SW', registration);
          }
        });
      }
    </script>
